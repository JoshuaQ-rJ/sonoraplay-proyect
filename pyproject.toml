[project]
name = "sonoraplay"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Joshua", email = "joshua.quintero@outlook.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errores de estilo PEP 8 y de lógica · I: orden de imports
# B: bugs comunes · UP: sintaxis moderna de Python
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"